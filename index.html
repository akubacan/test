    <title>Gallery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            max-width: 1000px;
            margin: auto;
        }

        .item {
            display: block;
            background: white;
            padding: 8px;
            border-radius: 10px;
            text-decoration: none;
        }

        .item img,
        .item video {
            display: block;
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 7px;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .item {
                padding: 5px;
            }

            .item img,
            .item video {
                height: 150px;
            }
        }
    </style>
</head>
